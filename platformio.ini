; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Dieses Repository ist zugleich die Bibliothek (src/, examples/) und ein
; PlatformIO-Projekt für Demo, Benchmark und Tests (extras/). Die Bibliothek
; wird per symlink:// aus der Wurzel eingebunden.
[platformio]
src_dir = extras/demo

[env:nodemcu-32s]
platform = espressif32
board = nodemcu-32s
framework = arduino
; Adafruit BusIO explizit: weil die Bibliothek hier die Projektwurzel ist
; (inkl. .pio/libdeps), löst der LDF die Kette Adafruit GFX -> BusIO sonst nicht auf
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit BusIO
    symlink://.
monitor_speed = 921600
upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001
upload_speed = 921600
build_unflags = -Os
build_flags = -O2

; ---------------------------------------------------------------------------
; Benchmark-Vergleich verschiedener ILI9341-Bibliotheken (extras/bench/)
; Alle mit gleichen Pins (CS 15, DC 2, RST 4, SCK 18, MOSI 23, MISO 19) und 40 MHz
; ---------------------------------------------------------------------------
[bench_common]
platform = espressif32
board = nodemcu-32s
framework = arduino
upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001
monitor_speed = 921600
upload_speed = 921600
build_unflags = -Os
build_flags = -O2

[env:bench_adafruit]
extends = bench_common
lib_deps = adafruit/Adafruit ILI9341@^1.6.1
build_src_filter = -<*> +<../bench/bench_adafruit.cpp>

[env:bench_tftespi]
extends = bench_common
lib_deps = bodmer/TFT_eSPI@^2.5.43
build_flags = ${bench_common.build_flags}
    -DUSER_SETUP_LOADED=1 -DILI9341_DRIVER=1
    -DTFT_MISO=19 -DTFT_MOSI=23 -DTFT_SCLK=18 -DTFT_CS=15 -DTFT_DC=2 -DTFT_RST=4
    -DLOAD_GLCD=1 -DSPI_FREQUENCY=40000000 -DSPI_READ_FREQUENCY=10000000
build_src_filter = -<*> +<../bench/bench_tftespi.cpp>

[env:bench_lovyan]
extends = bench_common
lib_deps = lovyan03/LovyanGFX@^1.1.16
build_src_filter = -<*> +<../bench/bench_lovyan.cpp>

[env:bench_arduinogfx]
extends = bench_common
lib_deps = moononournation/GFX Library for Arduino@1.4.9
build_src_filter = -<*> +<../bench/bench_arduinogfx.cpp>

[env:bench_ours]
extends = bench_common
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit BusIO
    symlink://.
build_src_filter = -<*> +<../bench/bench_ours.cpp>
